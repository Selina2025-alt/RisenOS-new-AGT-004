services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agt_rsn_004
      POSTGRES_USER: risen
      POSTGRES_PASSWORD: risen
    ports:
      - "5432:5432"
    volumes:
      - agt004-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risen -d agt_rsn_004"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: risen
      MINIO_ROOT_PASSWORD: change-me-now
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - agt004-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 risen change-me-now &&
      mc mb --ignore-existing local/agt-rsn-004
      "

  opa:
    image: openpolicyagent/opa:1.10.1-static
    command: run --server --addr=0.0.0.0:8181 /policies
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro

volumes:
  agt004-postgres:
  agt004-minio:
