name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  osv:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8dc09193bb540e09b23da07ad7e30bd33bf87018
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.164.0
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/typescript --config p/nodejs --error .

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint:boundaries
      - run: pnpm build
